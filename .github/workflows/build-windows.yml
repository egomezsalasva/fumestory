name: Build Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Create offline seed database
        shell: pwsh
        run: |
          python -c @"
          import sqlite3
          from pathlib import Path
          db = Path('src-tauri/db/fumestory-offline.sqlite')
          conn = sqlite3.connect(db)
          conn.executescript(Path('src-tauri/db/schema.sql').read_text(encoding='utf-8'))
          conn.executescript(Path('src-tauri/db/seed-curated.sql').read_text(encoding='utf-8'))
          conn.close()
          print(f'created {db} ({db.stat().st_size} bytes)')
          "@

      - name: Build offline desktop
        env:
          VITE_APP_RUNTIME: offline
        run: pnpm exec tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: fumestory-windows
          path: src-tauri/target/release/bundle/nsis/*.exe